spring.application.name=log-summarizer
server.port=8080

# ─────────────────────────────────────────────────────────────────
# LLM Provider Selection  (Factory pattern)
# Change this value to switch models — no code changes required.
# Supported values: gemini
# ─────────────────────────────────────────────────────────────────
app.llm.provider=gemini

# ─────────────────────────────────────────────────────────────────
# Google Gemini (Spring AI — spring-ai-starter-model-google-genai)
# ─────────────────────────────────────────────────────────────────
# Replace the placeholder below with your actual Gemini API key.
# Obtain a free key at: https://aistudio.google.com/apikey
spring.ai.google.genai.api-key=YOUR_GEMINI_API_KEY_HERE

# Best free-tier model: gemini-2.0-flash (fast, capable, generous quota)
spring.ai.google.genai.chat.options.model=gemini-2.0-flash

# Low temperature for deterministic, factual log analysis
spring.ai.google.genai.chat.options.temperature=0.2

# Force the Gemini API to return application/json — dual enforcement
# (the prompt also instructs JSON-only output)
spring.ai.google.genai.chat.options.response-mime-type=application/json
